name: Build PixelGram

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up NDK r27c
        uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install NDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build meson nasm gperf pkg-config unzip python3-pip

      - name: Install NDK 27.2.12479018
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.96.1 -t aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Configure
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          echo "DUMMY_CONST=0" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties
          echo "APP_ID=${APP_ID:-0}" >> gradle.properties
          echo "APP_HASH=${APP_HASH:-0}" >> gradle.properties
          echo "ADDITIONAL_BUILD_NUMBER=0" >> gradle.properties
          echo "USER_REPO=$GITHUB_REPOSITORY" >> gradle.properties
          echo "CHECK_UPDATES=0" >> gradle.properties
          echo "F_DROID=0" >> gradle.properties

      - name: Build
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease

      - name: Prepare APK
        run: |
          mkdir -p artifact
          cp TMessagesProj_App/build/outputs/apk/afat/release/app.apk artifact/PixelGram.apk
          ls -lh artifact/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelGram-apk
          path: artifact/PixelGram.apk
          if-no-files-found: error

  release:
    name: Attach APK to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PixelGram-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: PixelGram.apk
          name: PixelGram ${{ github.ref_name }}
          body: |
            PixelGram — неофициальный клиент Telegram с дизайном Material You 3.

            Исходный код: https://github.com/${{ github.repository }}
